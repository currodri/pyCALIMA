# Method card: Micelotta, Jones & Tielens 2011, A&A 526, A52, "Polycyclic
# aromatic hydrocarbon processing by cosmic rays" (MJT11). It builds on
# Micelotta+2010b (MJTb) for the disc geometry and the dissociation probability.
#
# Conventions as in andrews16.toml: each value has a `source` and a
# `confidence` (A experiment, B benchmarked theory, C theory, D extrapolation,
# E assumption). "inferred" marks a value not printed but implied by printed ones.

[card]
name = "Micelotta2011"
bib_key = "Micelotta2011"
citation = "Micelotta, Jones & Tielens 2011, A&A 526, A52 (doi:10.1051/0004-6361/201015741; arXiv:1012.1599)"
read_from = "arXiv:1012.1599v1 (accepted version): all sections, eqs. 1-42, Tables 1-2, Figs. 1-10"
status = "draft"

[species]
geometry = "thick disc of radius R = 0.9 sqrt(N_C) A (Omont 1986) and thickness d (Sect. 2.2, Fig. 2)"
thickness = { value = 4.31, unit = "A", source = "Sect. 2.2 (MJTb electron-density thickness)", confidence = "E" }
sizes = "N_C = 50, 100, 200, 1000 (Sect. 6.1); R = 6.36, 9, 12.7, 28.5 A"
n_max = "10, 20, 40, 200 IR photons for N_C = 50, 100, 200, 1000 (Sect. 6.1), i.e. N_C / 5"
path = "l(theta) = d / |cos theta| if |tan theta| < tan alpha (alpha the disc diagonal, tan alpha = 2R/d), else 2R / |sin theta| (Sect. 2.2)"
geometric_cross_section = "sigma_g(theta) = pi R^2 cos theta + 2 R d sin theta (eq. 28)"

[stopping]
formula = "S = kappa Z2 Z1^2 / beta^2 [f(beta) - ln I], f = ln(2 m c^2 beta^2 / (1 - beta^2)) - beta^2 (eqs. 5, 10); heavier ions S(Z1) = S(p) (Z1*/Zp*)^2 (eq. 8)"
kappa = { value = 5.7508e-4, unit = "eV A^-1 (amorphous carbon, N = 1.1296e23 atoms cm^-3)", source = "Sect. 2.1", confidence = "C" }
z2 = { value = 6.0, unit = "", source = "Sect. 2.1 (carbon target)", confidence = "A" }
mean_ionisation = { value = 79.1, unit = "eV", source = "Sect. 2.1 (SRIM carbon)", confidence = "B" }
effective_charge = "Z1* = Z1 [1 - exp(-125 beta Z1^(-2/3))] (eq. 9, Barkas)"
beta = "beta^2 = 1 - 1 / [1 + E(GeV) / (0.931494 M1)]^2, E the kinetic energy per ion (eq. 6)"
energy_transferred = "T(theta) = S l(theta) (eq. 11); a fraction f goes into vibration (Sect. 6.1)"

[dissociation]
probability = "P = k0 exp(-E0 / k T_av) / [k_IR / (n_max + 1) + k0 exp(-E0 / k T_av)] (eq. 12)"
temperature = "T = 2000 (E'/N_C)^0.4 (1 - 0.2 E0 / E') K (eq. 14); T_av = sqrt(T(E' = f T) T(E' = f T - n_max de)) (eq. 13)"
k0 = { value = 1.4e16, unit = "s^-1", source = "Sect. 2.2 (MJTb)", confidence = "E" }
k_ir = { value = 100.0, unit = "photons s^-1", source = "Sect. 2.2 (Jochims+94)", confidence = "E" }
photon_energy = { value = 0.16, unit = "eV", source = "Sect. 2.2 (a typical C-C mode)", confidence = "E" }
e0_reference = { value = 4.58, unit = "eV", source = "Sect. 2.2; Fig. 8 uses 4.6", confidence = "E" }
e0_low = { value = 3.65, unit = "eV", source = "Sect. 2.2", confidence = "E" }
e0_high = { value = 5.6, unit = "eV", source = "Sect. 2.2", confidence = "E" }
carbon_per_event = { value = 2.0, unit = "C atoms (C2 loss)", source = "eq. 30", confidence = "E" }
destruction = "destroyed when 1/3 of the carbon is lost: tau0 = N_C / (3 R_i) for ions (eq. 34), ln(3/2) N_C / R_e for electrons (eq. 37)"

[electrons]
cross_section = "McKinley & Feshbach (1948) as given by Banhart (1999), eq. 18; T_max = 2 E (E + 2 m c^2) / (M2 c^2) (eq. 16); one C ejected per collision"
t0_reference = { value = 7.5, unit = "eV", source = "Sect. 3", confidence = "E" }
t0_values = "4.5, 7.5, 15 eV (Sect. 3)"
orientation_factor = { value = 0.5, unit = "", source = "eq. 31 (angle-averaged orientation, MJTa)", confidence = "E" }
orientation_discrepancy = "With the 0.5 of eq. 31, eqs. 18, 25 and 37 give lifetimes 2.08x the Table 2 values for all three T0. Without it they reproduce Table 2 to 4% (1.25e13, 2.09e13, 4.18e13 yr), so Table 2 was computed without the factor. The runner defaults to the printed eq. 31; orientation=1 reproduces Table 2"

[spectra]
ions = "I(E) = C E^0.3 / (E + E0*)^3 [particles cm^-2 s^-1 sr^-1 GeV^-1], E the kinetic energy per ion in GeV (eq. 22); E0*(ion) = 0.12 GeV x M1 (Sect. 4)"
table1 = "H: M1 = 1, C = 1.45; He: 4, 0.90; CNO: 14, 0.36; Fe-Co-Ni: 58, 0.24 (Table 1; C in (cm^2 s sr GeV^-1.7)^-1)"
e0_star_h = { value = 0.12, unit = "GeV", source = "Sect. 4, eq. 23 (zeta = 4e-16 s^-1 per H, Indriolo+09)", confidence = "D" }
electrons = "I(E) = A [E(GeV) x 1e3]^-gamma [cm^-2 s^-1 sr^-1 GeV^-1]: A = 0.0254e5, gamma = 1.8 for 5e-3 <= E <= 2 GeV; A = 5.19e5, gamma = 2.5 for 2 < E <= 1e3 GeV (eq. 25, Cummings 1973)"
e_min_ions = { value = 5.0, unit = "MeV per nucleon", source = "Sect. 4 and 5", confidence = "E" }
e_max = { value = 10.0, unit = "GeV", source = "Sect. 5", confidence = "E" }
e_max_ambiguity = "Sect. 5 gives 10 GeV without saying per ion or per nucleon; Fig. 1 plots stopping up to 1e4 MeV/nucleon. The runner reads it as per nucleon and reports the per-ion alternative"
e_min_electrons = { value = 5.0, unit = "MeV", source = "Sect. 4 and Table 2", confidence = "E" }
rate = "R_coll = 4 pi int F_C I(E) Sigma(E) dE, Sigma = int_0^(pi/2) sigma_g P sin theta dtheta, F_C = 1 (eqs. 26-29)"

[targets]
electron_lifetime_t0_4p5 = { value = 1.2e13, unit = "yr", source = "Table 2", confidence = "C" }
electron_lifetime_t0_7p5 = { value = 2.0e13, unit = "yr", source = "Table 2", confidence = "C" }
electron_lifetime_t0_15 = { value = 4.2e13, unit = "yr", source = "Table 2", confidence = "C" }
shock_lifetime = { value = 1.5e8, unit = "yr", source = "Sect. 7.1 (MJTa)", confidence = "C" }
crossover_nc_f0p5 = { value = 150.0, unit = "N_C where the total CR lifetime (ions + electrons, E0 = 4.6, T0 = 7.5 eV) equals the shock lifetime, f = 0.5", source = "Sect. 7.1 ('less than ~150 and ~280 C-atoms respectively'), Fig. 8", confidence = "C" }
crossover_nc_f1 = { value = 280.0, unit = "the same for f = 1", source = "Sect. 7.1, Fig. 8", confidence = "C" }
