[lp09]
# Le Page, Snow & Bierbaum 2009, ApJ 704, 274: what changes for H2 formation.
mechanism = "PAH-H + H -> PAH; PAH + hnu -> PAH+ + e; PAH+ + H -> PAH+H+; PAH+H+ + e -> PAH+H + hnu (branching 0) / PAH-H + H2 (a) / PAH + H (1 - a) (eqs. 3a-3d, Fig. 1); plus k'diss: PAH+H+ + hnu -> PAH-H+ + H2, and k_H2: PAH-H+ + H2 -> PAH+H+"
states = "six: PAH-H, PAH, PAH-H+, PAH+, PAH+H+ (Fig. 1); no anions"
branching_a = { value = 0.5, unit = "H2 fraction of PAH+H+ recombination (stabilisation 0)", source = "LP09 Sects. 2-3 (H2 binding 4.5 eV ~ C-H 4.8 eV)", confidence = "E" }
k_h_pah_minus_h_cation = { value = 1.6e-10, unit = "cm^3 s^-1, PAH-H+ + H", source = "LP09 Sect. 4.3 (small PAH ions)", confidence = "D" }
k_h_pah_cation = { value = 2.0e-10, unit = "cm^3 s^-1, PAH+ + H (Paper I: (y/x) 2.2e-10)", source = "LP09 Sect. 4.3", confidence = "D" }
size_scaling_of_kH = "not stated (Paper I scaled with y/x)"
recombination = "changed: 'the rate of recombination between the pyrene ion and an electron approaches the value deduced from an extension of classical grain theory... we have chosen this rate, following Vuong & Foing (2000)' (Sect. 4.2); the value is not stated"
other_rates = "'the same as those inferred in Le Page et al. (2001)' (Sect. 3)"
f_definition = "f = 2 n_H2 / nt (Paper I/LP03 used n_H2/n_H; both give n_H2 = 25 at nt = 100, f = 0.5)"
c_h_pah = { value = 3.3e-5, unit = "C in PAHs per H (15 % of 220 ppm)", source = "LP09 Sect. 3", confidence = "E" }
ne_over_nt = "not stated (presumably 1.4e-4)"
rate_definition = "R_PAH = (a k_rec n_e + k'diss) n(PAH+H+) / (nt n_H) (Sect. 3)"
beta0 = { value = 5.0e-11, unit = "s^-1, unshielded H2 photodissociation", source = "LP09 Sect. 3 (Duley & Williams 1984)", confidence = "D" }
