# Method card: the pahchem baseline (pycalima.pahchem.baseline.Params defaults).
#
# Not a published model: pahchem's own choices, each from the laboratory-gated
# pieces where they exist. Conventions as in andrews16.toml (source, A-E
# confidence). Every entry is a knob of the sensitivity analysis.

[card]
name = "pahchem_baseline"
bib_key = "West2018"
citation = "pahchem baseline (this work); dissociation from West et al. 2018, PCCP 20, 7195"
read_from = "pahchem-spec.md, M2-M5"
status = "draft"

[species]
parents = ["C24H12", "C54H18", "C96H24"]
nh_range = "0 to NH0 + 4"
charges = "Z with a Table A.1 IP (Andrews+16): C54 -1..+2"
modes = "parent PAHdb v4 modes for every state (variant: PAHSpecies.stripped)"

[dissociation]
rate_form = "RRKM; TS = reactant minus one C-H stretch, 5 lowest modes scaled to dS(1000 K) (West+18 convention)"
h_loss_even = { E_act = 4.41, dS_J_K_mol = 12.0, source = "West+18 Table 1, R20 coronene+ (+-0.83 eV, +-44)", confidence = "A" }
h_loss_odd = { E_act = 3.16, dS_J_K_mol = 10.0, source = "West+18 abstract: second H loss ~3.16 eV on average; dS chosen", confidence = "B" }
h2_loss = { E_act = 4.58, dS_J_K_mol = 40.0, source = "West+18 Table 1, R15 perylene+ (+-1.3 eV, +-69)", confidence = "B" }
h_loss_superh_Zle0 = { E_act = 1.40, dS_J_K_mol = 12.0, source = "Andrews+16 Table 2 (Bauschlicher & Ricca 2014); dS chosen", confidence = "C" }
h_loss_superh_Zgt0 = { E_act = 1.55, dS_J_K_mol = 12.0, source = "Andrews+16 Table 2; dS chosen", confidence = "C" }
degeneracy = "N_H for aromatic H loss, 1 for the odd-H radical, 2 for H2, N_H - N_H0 for super-H (West+18 ESI k(E): sigma = 12 coronene+, 10 fluoranthene+, 1 for second H)"
laboratory_systematic = "E0 thresholds of West+18 and Jochims+94 differ by 0.7-1.4 eV"
carbon_loss = { set = "leger89", C = [7.37, 6.2e15], C2 = [8.49, 3.5e17], C3 = [7.97, 1.5e18], unit = "[E0 eV, A s^-1], inverse-Laplace k = A rho(E - E0)/rho(E)", source = "Leger, d'Hendecourt, Boissel & Desert 1989, A&A 213, 351, Table 2: graphite sublimation (2000-4000 K) applied to dehydrogenated PAHs by assumption, as Visser+07 and Montillaud+13 (Sect. 7.2) do", confidence = "C" }
carbon_loss_variants = "c60_cage: C2 of C60+, 10.0 eV and 5e19 s^-1 (Matt+01; Tomita+01 9.8 eV, 2e19): the slow bound if bare C54/C96 fold into cages first (folding 4.0 eV, 1e15 s^-1, Lebedeva+12); micelotta10b: 4.6 eV, dS 10 cal K^-1 mol^-1 RRKM, the fast bound"
carbon_loss_history = "Until 2026-10-06 the default was micelotta10b. That pair is C2H2 loss from small cations (Ling & Lifshitz 98 dS; E0 3.65 eV fitted to Jochims+94 C2H2 appearance energies, raised to 4.6 eV for a 1e8 yr lifetime at N_C ~ 50; Micelotta+10b Sect. 4.1), which Micelotta+10b themselves say closes the bare-carbon channels and Murga+22 (MNRAS 517, 3732) call an upper limit. Grade D. It is 1e3-1e4x faster than leger89 for bare C24/C54 at G0 = 1e2-1e4"
carbon_loss_rate_form = "Cascade sinks of the bare skeleton (PAHdb C24/C54/C96 modes; else stripped parent), all fragments competing. RAMSES table k = sum_Z f(Z, N_H=0) r_C(Z) / 2, r_C = sum n_C k_fragment (C2 units, as the solver converts with 2 m_C; export_pah_tables)"
carbon_loss_caveats = "C24 and smaller bare skeletons isomerise to rings that lose C3 or break into C11-C15 rings (Ferrari+23; Panchagnula+24, where rings appear after 8 of 12 H are lost); C54/C96 flakes probably fold into cages first. No measured E0 exists for any bare planar C24-C96"

[cascade]
method = "energy_me microcanonical IR cascade with dissociation sinks, multiphoton steady state"
recurrent_fluorescence = "not included (sensitivity: IR rates x3)"

[photophysics]
sigma = "Li & Draine 2001 at the LD01 radius, neutral tables for Z <= 0, ionised for Z > 0"
yield = "Jochims+96 linear ramp; cation -> dication: Wenzel+20 eqs. 4-5 where stated (N_C >= 32, IP2 < 11.3 eV), gated against their measured sigma_I to 0.09 dex rms (test_pahchem_wenzel2020.py); photodetachment with IP = EA"
ionising_photons_heat = "no (sensitivity: yes)"
ip_ladder = "Andrews+16 Table A.1 + 0.1 eV per missing H"

[electrons]
capture = "BT94 with DS87 J~, a = 0.9 sqrt(N_C) A, x0.82"
sticking_cation = { value = 1.0, source = "extrapolation of C6-C16 recombination data (pah_electron_recombination.csv)", confidence = "D" }
sticking_neutral = { value = "statistical", source = "pahchem.attachment: detailed-balance autodetachment vs harmonic IR stabilisation, PAHdb parent and anion modes, EA of Andrews+16 Table A.1, neutral at its radiative P(E) at G0 = 1; C24H12 2.5e-3 at 100 K, C54H18 and C96H24 1. Capture efficiency eta = 1 (C60, Viggiano+10); where autodetachment dominates the rate does not depend on eta", confidence = "C" }

[hydrogen]
cation_addition = { value = 1.4e-10, unit = "cm^3 s^-1", source = "Betts+06 coronene+ (as Andrews+16)", confidence = "A" }
neutral_addition = "geometric 35.7 A^2 x N_C/24 with Rauls & Hornekaer barriers; 7 % for dehydrogenated (Andrews+16)"
associative_detachment = { value = 7.8e-10, unit = "cm^3 s^-1", source = "Demarais+12 (as Andrews+16)", confidence = "D" }
eley_rideal = { value = 0.06, unit = "A^2", source = "Mennella+12", confidence = "A" }

[targets]
sensitivity = "diagnostics/pahchem/check_sensitivity.py at NGC 7023 NW edge and the Orion Bar atomic PDR"
