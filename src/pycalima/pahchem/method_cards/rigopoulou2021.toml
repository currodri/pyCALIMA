# Method card: Rigopoulou et al. 2021, MNRAS 504, 5287 ("R21").
#
# Conventions as in andrews16.toml (source, A-E confidence; "not stated",
# "inferred"). Read from arXiv:2011.10114v2 (the accepted version) and its
# source; only Fig. 1 is a vector figure.
#
# Status (2026-10-06): Fig. 1 recovered (rigopoulou2021.py,
# tests/test_pahchem_rigopoulou2021.py). The binned diagnostics (Figs. 5-11)
# cannot be reproduced from what is stated; the questions are at the end.

[card]
name = "Rigopoulou2021"
bib_key = "Rigopoulou2021"
citation = "Rigopoulou, Barale, Clary, Shan, Alonso-Herrero, Garcia-Bernete, Hunt, Kerkeni, Pereira-Santaella & Roche 2021, MNRAS 504, 5287 (doi:10.1093/mnras/stab959; arXiv:2011.10114)"
read_from = "arXiv v2 LaTeX source and PDF; Fig. 1 from the vector fig1v2.pdf; Figs. 5, 7-9 digitised from rasters (+-2 %)"
status = "partial"

[species]
selection = "20 < N_C < 400, neutral and singly cationic spectra available, no O, N, Fe, Mg (Sect. 2.1)"
table_a1 = "82 formulae with PAHdb UIDs; 17 marked as computed independently (B3LYP/4-31G, Gaussian 09), not published; data 'on reasonable request'"
table_a1_errors = "533 and 625 are C40H22 and C40H16 (listed C40H18), likewise cations 540, 626; 3252/3253 are C67H21 (listed C67H23); cation 32578 does not exist (3258?); cation 722 is a BP86 C80H20+, the cation of 718 is 721"
database = { value = "PAHdb, version not stated; v3.20 fits the UIDs and Fig. 1", source = "Sect. 2.1; inferred from Fig. 1", confidence = "D" }
scaling_text = "the stated factors (0.956 below 2 um, 0.952 at 4-9 um, 0.96 beyond 9 um) are a garbled copy of the PAHdb v3 factors (0.9595 > 2500, 0.9523 1111-2500, 0.9563 < 1111 cm^-1); Fig. 1 matches the stored, already-scaled modes"

[dissociation]
modelled = "no: emission only"

[emission]
model = { value = "thermal-approximation cascade from the peak temperature (Verstraete+01, Leger+89), eqs. 2-7", source = "Sect. 2.2; eq. 7 is garbled", confidence = "C" }
fig1_energies_eV = { value = [5.0, 12.4], source = "Sect. 2.2 text (caption: 12 eV); 12.4 fits, 12.0 gives 3.0 % and 13.6 gives 9.8 % rms", confidence = "A" }
profile = { value = "Lorentzian, FWHM 15 cm^-1", source = "inferred from Fig. 1 (1.6 % rms); the text states 30 cm^-1, which gives 12.8 %", confidence = "D" }
redshift = "none (the 11.3 band sits at 10.95 um in Figs. 1 and 6)"
isrf = "Sects. 3-4 use 'ISRF' to '1e3 x ISRF'; how an intensity maps to photon energies is not stated"

[bands]
method = "per-band Lorentzian fits with a first-order polynomial continuum in CASSIS, centres and widths free (Sect. 3); spectra averaged per N_C bin with 3-sigma clipping"
bins = "not consistent between figures (Fig. 2, 4, 5, 7 differ; Sect. 4.2: 20-40 and 200-400)"

[targets]
fig1 = "UID 742 at 5 and 12.4 eV: thermal cascade, FWHM 15 cm^-1, 12 band peaks to 1.6 % rms; pahchem's exact cascade 4.8 % (lower 3.3 um at 5 eV)"
fig8_check = "Table A1 neutrals with a matching PAHdb entry, spectra averaged per bin, Maragkoudakis+20 windows instead of CASSIS fits (diagnostic only): small-bin 11.3/3.3 0.64/0.43/0.33/0.27 against 0.68/0.52/0.35/0.27 at 6/8/10/12 eV; small-bin 11.3/7.7 2.5-2.1 against 1.3-0.55; large bin (3 PAHdb species) 11.3/3.3 3x and 11.3/7.7 0.75x theirs"
internal_inconsistencies = "large-bin neutral 11.3/7.7 is 2.2-3.2 (Fig. 8), 2.0 (Fig. 9), 1.6 (Fig. 11); 11.3/3.3 at N_C ~ 400 is 21.9 (Fig. 7), 15.3 (Fig. 9), 35 at 6 eV (Fig. 8); I_3.3(12.4)/I_3.3(5) is ~11 in the text, 32 in Fig. 1; Fig. 9's x is the neutral fraction, against its caption; conclusion (iii) states the opposite trend of Fig. 9"

[questions]
for_the_authors = "(1) the own-DFT spectra of the 17 molecules and whether they were scaled; (2) the code (AmesPAHdb suite?) and the FWHM actually used (15 or 30 cm^-1); (3) the bin edges and the mixture construction of Figs. 8-11; (4) how 'ISRF' and '1e3 x ISRF' were turned into photon energies; (5) the CASSIS fit constraints behind 11.3/7.7 (our window ratios of the small bin are 2-4x theirs); (6) the Table A1 UID corrections above"
