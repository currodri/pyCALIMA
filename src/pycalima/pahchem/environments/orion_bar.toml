# Input conditions of the PDRs4All Orion Bar templates, for pahchem's emission comparison.
#
# pahchem does not compute these: they are inputs of the PAH network and its emission.
# Each quantity is a value or a [low, high] range with its `source` and an A-E `confidence`
# (as the method cards). `stated = false` marks values no paper gives for that template; their
# range is pahchem's assumption, with the reason in `source`.
#
# The electron density is given as n_e [cm^-3] where it is measured, else as x_e = n_e/n_H, bounded
# by the gas-phase C+ and S+ abundances.
#
# n_h is the total hydrogen density n_H = n(H) + 2 n(H2), as in every source cited (Meudon's proton density;
# Habart+24's column per proton), and sets n_e = x_e n_H. n_h_atomic is the atomic n(H), which H addition,
# associative detachment and Eley-Rideal need (``Environment.n_h``); no paper gives it per template.
#
# The template apertures are Peeters+24 Table B.1. G0 is in Habing units (6-13.6 eV) unless the entry names
# another ``definition`` (conditions.G0_DEFINITIONS), which pahchem converts. The field
# shape is theta1 Ori C (O7V, Teff ~ 39 000 K; Zannese+26b, Simon-Diaz+06), here a 40 000 K
# Kurucz atmosphere.

[region]
name = "Orion Bar (PDRs4All templates)"
field_teff_k = { value = 40000, source = "theta1 Ori C, Teff 39 000 K (Zannese+26b, arXiv:2609.31287, Table 1); Kurucz 40 000 K grid point", confidence = "B", stated = true }
templates = ["HII", "Atomic", "DF1", "DF2", "DF3"]

[HII]
note = "AIB emission of this template comes from the face-on background PDR (Chown+24), whose conditions are not stated: the Atomic PDR ranges are used"
g0 = { range = [2.2e4, 7.1e4], definition = "fnu_1030A", source = "assumed equal to the Atomic PDR (background face-on PDR; Chown+24)", confidence = "E", stated = false }
n_h = { range = [4e4, 3e5], source = "assumed equal to the Atomic PDR", confidence = "E", stated = false }
n_h_atomic = { range = [4e4, 3e5], source = "assumed n(H) = n_H in the background PDR's atomic layer, as in the Atomic PDR; not stated", confidence = "E", stated = false }
t_gas = { value = 659, source = "H2 rotational T1* 659 +- 54 K (Van De Putte+24 Table 4)", confidence = "B", stated = true }
x_e = { range = [1.4e-4, 1.6e-4], source = "assumed as the Atomic PDR, not measured: bounded by gas-phase C+ plus S+. The carbon recombination lines (n_e 60-100, Cuadrado+19) arise in the C+/C/CO layer at the DF, where n_H >= 4-7e5, and do not apply here (until 2026-10-26 this entry took n_e = 10-100 from them, which needs x_e up to 2e-3 at this n_H)", confidence = "E", stated = false }

[Atomic]
g0 = { range = [2.2e4, 7.1e4], definition = "fnu_1030A", source = "at the ionisation front from O I 1.317 um fluorescence, median 5.9e4, inclination 4 deg (Peeters+24 Sect. 5.3.1); x4 for 1 deg, /2 for 8 deg. Defined as F_nu(1027/1040 A) / 8.7e-19 erg cm^-2 s^-1 Hz^-1 (their App. A), not the 6-13.6 eV integral", confidence = "B", stated = true }
n_h = { range = [4e4, 3e5], source = "5e4-1e5 from the decay of the AIB emission (Habart+24); widened to the isobaric range P/T for P = 3e7-2e8 K cm^-3 (Zannese+26a HD, arXiv:2510.11248; Joblin+18) at T 722 K (range widened 2026-10-26, when n_e became x_e n_H); the Meudon H2 fit of this template gives 1e3-3.5e3 (Peeters+24), inconsistent with it", confidence = "C", stated = true }
n_h_atomic = { range = [4e4, 3e5], source = "n(H) = n_H: the shallow atomic PDR, where Henney 2021 (MNRAS 502, 4597, Sect. 4.2.3) measures n(H0) = 8.5e4 (8.5e4-1.7e5, 'about 1e5') from Raman-scattered H-alpha at 2-8 mpc depth, on a cut across the Bar, not this aperture", confidence = "C", stated = false }
t_gas = { value = 722, source = "H2 rotational T1* 722 +- 50 K (Van De Putte+24 Table 4)", confidence = "B", stated = true }
x_e = { range = [1.4e-4, 1.6e-4], source = "not measured in the atomic layer: bounded by gas-phase C+ plus S+. The carbon recombination lines (n_e 60-100, Cuadrado+19) arise in the C+/C/CO layer at the DF, where n_H >= 4-7e5, and do not apply here (until 2026-10-26 this entry took n_e = 10-100 from them, which needs x_e up to 2e-3 at this n_H)", confidence = "C", stated = false }

[DF1]
note = "strongly contaminated by foreground atomic-PDR emission (Chown+24)"
g0 = { range = [1e3, 5e3], source = "not stated for DF1; Chown+24: PAH-ionising flux ~40x lower at the DFs than at the surface; about the DF3 range of Zannese+26b (1.3e3-5e3), rounded down to 1e3", confidence = "D", stated = false }
n_h = { range = [4e5, 1e6], source = "Cuadrado+19: n_e 60-100 with x_e <= 1.4e-4 gives n_H >= (4-7)e5 (P_th >= 2-4e8 K cm^-3) toward the DF [read]; ~1e6 near the DF from HCN/CN with RADEX and Meudon (Zannese+26, arXiv:2609.19361; number from a secondary summary, check the paper) [sec]. The Meudon H2 fits (Peeters+24, 1e4-3.5e4 at 4 deg inclination, x2.85 at 8 deg) are lower by 10-100x; they set the range here until 2026-10-26", confidence = "C", stated = true }
n_h_atomic = { range = [5e3, 3.2e4], source = "not stated per front. van der Werf+13 (ApJ 762, 101, Sect. 6.1): 21-cm N(H I) = 3e21 cm^-2 in the layer of the H2 vibrational emission, i.e. n(H) = N/l = 5e3-2e4 for l_PDR = 0.05-0.2 pc (Peeters+24 Table 2; pahchem's arithmetic; their 5-10 % of n_H assumes n_H = 1-2e5); Zannese+26a (PDRs4All XVII, arXiv:2510.11248, Sect. 3.2, Table 2) isobaric Meudon model, n(H) = 2.6e4-3.2e4 across the partially atomic zone II, where the DFs sit", confidence = "D", stated = false }
t_gas = { value = 706, source = "H2 rotational T1* 706 +- 35 K (Van De Putte+24 Table 4)", confidence = "B", stated = true }
n_e = { range = [60.0, 100.0], source = "mm-wave carbon recombination lines + [13C II] hyperfine lines, non-LTE, toward the DF (Cuadrado+19, A&A 625, L3; IRAM 30m, 25\" beam, so DF1-3 together), T_e 500-600 K; from neutral PDR gas of the C+/C/CO layer (narrow lines at +10.7 km/s), not the H II region. Caveat: the DF apertures also collect foreground atomic-PDR emission (Chown+24)", confidence = "B", stated = true }

[DF2]
g0 = { range = [1e3, 5e3], source = "not stated for DF2; as DF1", confidence = "D", stated = false }
n_h = { range = [4e5, 1e6], source = "Cuadrado+19: n_e 60-100 with x_e <= 1.4e-4 gives n_H >= (4-7)e5 (P_th >= 2-4e8 K cm^-3) toward the DF [read]; ~1e6 near the DF from HCN/CN with RADEX and Meudon (Zannese+26, arXiv:2609.19361; number from a secondary summary, check the paper) [sec]. The Meudon H2 fits (Peeters+24, 1e4-3.5e4 at 4 deg inclination, x2.85 at 8 deg) are lower by 10-100x; they set the range here until 2026-10-26", confidence = "C", stated = true }
n_h_atomic = { range = [5e3, 3.2e4], source = "not stated per front. van der Werf+13 (ApJ 762, 101, Sect. 6.1): 21-cm N(H I) = 3e21 cm^-2 in the layer of the H2 vibrational emission, i.e. n(H) = N/l = 5e3-2e4 for l_PDR = 0.05-0.2 pc (Peeters+24 Table 2; pahchem's arithmetic; their 5-10 % of n_H assumes n_H = 1-2e5); Zannese+26a (PDRs4All XVII, arXiv:2510.11248, Sect. 3.2, Table 2) isobaric Meudon model, n(H) = 2.6e4-3.2e4 across the partially atomic zone II, where the DFs sit", confidence = "D", stated = false }
t_gas = { value = 666, source = "H2 rotational T1* 666 +- 36 K (Van De Putte+24 Table 4)", confidence = "B", stated = true }
n_e = { range = [60.0, 100.0], source = "mm-wave carbon recombination lines + [13C II] hyperfine lines, non-LTE, toward the DF (Cuadrado+19, A&A 625, L3; IRAM 30m, 25\" beam, so DF1-3 together), T_e 500-600 K; from neutral PDR gas of the C+/C/CO layer (narrow lines at +10.7 km/s), not the H II region. Caveat: the DF apertures also collect foreground atomic-PDR emission (Chown+24)", confidence = "B", stated = true }

[DF3]
g0 = { range = [1.3e3, 5e3], source = "Zannese+26b (PDRs4All, H2, arXiv:2609.31287, Sect. 6.1): G0(IF) = 2e4 attenuated by A_V ~ 1-2 with R_V = 5.5 (< 1e3 for R_V = 3.1), an extinction estimate", confidence = "C", stated = true }
n_h = { range = [4e5, 1e6], source = "Cuadrado+19: n_e 60-100 with x_e <= 1.4e-4 gives n_H >= (4-7)e5 (P_th >= 2-4e8 K cm^-3) toward the DF [read]; ~1e6 near the DF from HCN/CN with RADEX and Meudon (Zannese+26, arXiv:2609.19361; number from a secondary summary, check the paper) [sec]. The Meudon H2 fits (Peeters+24, both line sets 3.5e3-3.5e4) are lower by 10-300x; they set the range here until 2026-10-26", confidence = "C", stated = true }
n_h_atomic = { range = [5e3, 3.2e4], source = "not stated per front. van der Werf+13 (ApJ 762, 101, Sect. 6.1): 21-cm N(H I) = 3e21 cm^-2 in the layer of the H2 vibrational emission, i.e. n(H) = N/l = 5e3-2e4 for l_PDR = 0.05-0.2 pc (Peeters+24 Table 2; pahchem's arithmetic; their 5-10 % of n_H assumes n_H = 1-2e5); Zannese+26a (PDRs4All XVII, arXiv:2510.11248, Sect. 3.2, Table 2) isobaric Meudon model, n(H) = 2.6e4-3.2e4 across the partially atomic zone II, where the DFs sit", confidence = "D", stated = false }
t_gas = { value = 661, source = "H2 rotational T1* 661 +- 40 K (Van De Putte+24 Table 4)", confidence = "B", stated = true }
n_e = { range = [60.0, 100.0], source = "mm-wave carbon recombination lines + [13C II] hyperfine lines, non-LTE, toward the DF (Cuadrado+19, A&A 625, L3; IRAM 30m, 25\" beam, so DF1-3 together), T_e 500-600 K; from neutral PDR gas of the C+/C/CO layer (narrow lines at +10.7 km/s), not the H II region. Caveat: the DF apertures also collect foreground atomic-PDR emission (Chown+24)", confidence = "B", stated = true }
