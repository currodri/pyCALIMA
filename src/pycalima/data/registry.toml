# ------------------------------------------------------- manual (PAHdb) ---
# The PAHdb filenames carry per-download tokens (_pIN3f5, _7ervm6e7rr3c8e4JqZE,
# _6oe6qc5q7mde16OC4e6), so there is no stable direct URL to fetch from. If you
# have one, change kind to "fetch" and fill in url/sha256.

[datasets.pahdb-theoretical-v4-00]
kind = "manual"
dest = "pahdb"
files = ["pahdb-complete-theoretical-v4.00.xml"]
size_bytes = 503_300_000
citation = "NASA Ames PAH IR Spectroscopic Database, theoretical library v4.00"
url = "https://www.astrochemistry.org/pahdb/"
url_status = "unconfirmed"
env_override = "CALIMA_PAHDB_DIR"
instructions = """The NASA Ames PAHdb cannot be redistributed with pyCALIMA:
downloading it requires a (free) registration.

  1. Register and log in at https://www.astrochemistry.org/pahdb/
  2. Under Downloads, get the complete theoretical library, v4.00, XML
     format (~500 MB). The file name may carry a per-download token.
  3. Tell pyCALIMA where it is, either:
       a) point an environment variable at the directory holding it
          (rename the file to pahdb-complete-theoretical-v4.00.xml):
              export CALIMA_PAHDB_DIR=/path/to/dir
       b) or copy/symlink it into the dataset cache (renamed for you):
              calima-fetch-data import pahdb-theoretical-v4-00 /path/to/downloaded.xml [--link]

Only pycalima.models.PAH_photophysics.pah_db_lookup needs it, when building a
new PAH species catalog. Everything else -- including the dust and PAH solvers
and the shipped PAH_states tables -- works without it."""

[datasets.pahdb-theoretical-v3-20]
kind = "manual"
dest = "pahdb"
files = ["pahdb-complete-theoretical-v3.20_pIN3f5.ascii"]
size_bytes = 71_360_000
citation = "NASA Ames PAH IR Spectroscopic Database, theoretical library v3.20"
url = "https://www.astrochemistry.org/pahdb/"
url_status = "unconfirmed"
env_override = "CALIMA_PAHDB_DIR"
instructions = """An older ASCII export of the PAHdb theoretical library. No
code in pyCALIMA reads it; it is registered only for provenance, so you do not
need it.

If you want it anyway, register (free) and log in at
https://www.astrochemistry.org/pahdb/, download the v3.20 theoretical library,
and either put it in $CALIMA_PAHDB_DIR as
pahdb-complete-theoretical-v3.20_pIN3f5.ascii or register it with:

    calima-fetch-data import pahdb-theoretical-v3-20 /path/to/downloaded.ascii
"""

# ----------------------------------------------------------------- fetch ---

# Optical constants of three Pop III supernova dust species that the bundled
# Kitzmann & Heng (2018) compilation lacks; used by pycalima.collapse.optics
# (data/external_data/collapse_materials.toml). One entry per file, so that
# each is checksummed. Fetched rather than bundled: none carries a
# redistribution licence except the CC0 refractiveindex.info file.

[datasets.optical-zubko-1996-acar]
kind = "fetch"
dest = "optical_props/zubko_1996"
files = ["nk.acar"]
url = "https://web.archive.org/web/19991128130527id_/http://physics.technion.ac.il/~zubko/AC_opt/nk.acar"
url_status = "confirmed"
sha256 = "dacbd52b51da2dc047eccf10daeb04045cb725746b99e7cb9e3632b6d160a0f3"
size_bytes = 42_502
citation = "Zubko, Mennella, Colangeli & Bussoletti (1996), MNRAS 282, 1321: amorphous carbon, sample ACAR"
notes = """Columns: wavelength [um], n, k; 0.040-1984 um. The author's page
(physics.technion.ac.il/~zubko/nk.html) no longer answers; this is its Wayback
Machine copy (raw bytes, 'id_'). Copyright V. Zubko 1996-1999; cite the paper."""

[datasets.optical-franta-2017-si]
