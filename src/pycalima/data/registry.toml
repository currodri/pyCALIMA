# pyCALIMA dataset registry.
#
# kind = "bundled"  ships inside the wheel; ensure_dataset() is a presence check
#      = "fetch"    downloaded on demand from `url`, verified against sha256
#      = "manual"   the user must obtain it themselves (registration, DOI,
#                   per-download link); ensure_dataset() fails with
#                   `instructions`, and `calima-fetch-data import` registers a
#                   local copy
#
# `dest` is relative to the bundled data root for kind="bundled", or to the
# dataset cache directory otherwise. See pycalima._paths.
#
# url_status = "confirmed"    verified to serve exactly these bytes
#            = "unconfirmed"  plausible upstream, NOT verified -- do not rely on it
#            = "none"         no public URL exists; this dataset MUST stay bundled
#
# Moving a dataset between bundled and fetched is a one-field edit here.
#
# NOTE ON PROVENANCE: this repository did not record where most of its
# reference data came from. Only optical_props/stx3141_supp/readme.txt carried
# a usable URL. Every `url` below marked "unconfirmed" is a plausible upstream
# that has NOT been checked, and several datasets are locally derived and
# cannot be re-downloaded byte-for-byte. Confirm before relying on
# `calima-fetch-data fetch`.

schema_version = 1

