# ------------------------------------------------------- manual (PAHdb) ---
# The PAHdb filenames carry per-download tokens (_pIN3f5, _7ervm6e7rr3c8e4JqZE,
# _6oe6qc5q7mde16OC4e6), so there is no stable direct URL to fetch from. If you
# have one, change kind to "fetch" and fill in url/sha256.

[datasets.pahdb-theoretical-v4-00]
kind = "manual"
dest = "pahdb"
files = ["pahdb-complete-theoretical-v4.00.xml"]
size_bytes = 503_300_000
citation = "NASA Ames PAH IR Spectroscopic Database, theoretical library v4.00"
url = "https://www.astrochemistry.org/pahdb/"
url_status = "unconfirmed"
instructions = """Download the complete theoretical library (v4.00) from
https://www.astrochemistry.org/pahdb/ and register your copy with:

    calima-fetch-data import pahdb-theoretical-v4-00 /path/to/pahdb-complete-theoretical-v4.00.xml

Needed only by pycalima.models.PAH_photophysics.pah_db_lookup when building a
species catalog. The shipped PAH_states tables were generated from it already."""

[datasets.pahdb-theoretical-v3-20]
kind = "manual"
dest = "pahdb"
files = ["pahdb-complete-theoretical-v3.20_pIN3f5.ascii"]
size_bytes = 71_360_000
citation = "NASA Ames PAH IR Spectroscopic Database, theoretical library v3.20"
url = "https://www.astrochemistry.org/pahdb/"
url_status = "unconfirmed"
instructions = """An older ASCII export of the PAHdb theoretical library. No
code in pyCALIMA reads it; it is registered only for provenance. It used to be
committed to this repository (68 MB) and now lives in reference_data/.

If you need it, download the v3.20 theoretical library from
https://www.astrochemistry.org/pahdb/ and register your copy with:

    calima-fetch-data import pahdb-theoretical-v3-20 /path/to/pahdb-complete-theoretical-v3.20_pIN3f5.ascii
"""

# ----------------------------------------------------------------- fetch ---

[datasets.cagliari-pah]
kind = "fetch"
dest = "external_data"
files = ["cagliari_pah_database.csv"]
size_bytes = 18_000
citation = "Malloci, Joblin & Mulas (2007), Cagliari PAH database"
url = "https://www.dsf.unica.it/~gmalloci/pahs"
url_status = "confirmed"
fetcher = "pycalima.models.tools.download_cagliari_pah_database:main"
notes = """The only dataset with a working programmatic fetcher, which the
bundled copy was produced by. Also bundled, so the fetch is only for refresh."""
