url_status = "confirmed"
sha256 = "45e271e0e8d20aa9617da5e98522cbbf29867ab7294d382760188b4d1fa5f969"
size_bytes = 190_560
citation = "Franta et al. (2017), crystalline Si at 300 K, via refractiveindex.info (CC0)"
notes = """YAML with a tabulated wavelength [um], n, k block; 0.031-310 um,
pinned to a commit of the refractiveindex.info database mirror."""

[datasets.optical-triaud-magnetite]
