# Grain materials of the collapse model (pycalima.collapse.materials).
#
# The ten species of Pop III supernova dust (Nozawa et al. 2003, ApJ 598, 785;
# Chiaki et al. 2015, MNRAS 446, 2659).
#
# [species.<name>.key]: growth by accretion of the gas-phase key species
#   (Chiaki+15 Table 2, values from Nozawa+03): the reaction, the molecular
#   weight mu of the solid per key nucleus [amu] and the hypothetical radius a0
#   of a monomer per key nucleus [Angstrom]. The bulk density follows,
#   rho_s = mu m_u / (4 pi a0^3 / 3). A species with two key species lists both;
#   the one with the shorter collision time controls growth.
#   m_gas: mass of the gas-phase key species [amu].
# surface_amu: mean atomic mass of the solid (formula mass / atoms per formula
#   unit), for mass-dependent thermal accommodation.
# optics: "bundled:<file>" in data/optical_props/stx3141_supp (Kitzmann & Heng
#   2018, MNRAS 475, 94, their compilation), or "dataset:<name>/<file>", a file
#   of a dataset registered in data/registry.toml (fetched with calima-fetch-data).

[species.Si]
formula = "Si"
surface_amu = 28.086
optics = "dataset:optical-franta-2017-si/Franta-300K.yml"
optics_ref = "Franta et al. (2017), crystalline Si, 300 K, via refractiveindex.info"
  [[species.Si.key]]
  gas = "Si"
  m_gas = 28.086
  reaction = "Si(g) -> Si(s)"
  mu = 28.0
  a0_angstrom = 1.684

[species.Fe]
formula = "Fe"
surface_amu = 55.845
optics = "bundled:Fe.dat"
optics_ref = "Lynch & Hunter (1991), in Palik, via Kitzmann & Heng (2018)"
  [[species.Fe.key]]
  gas = "Fe"
  m_gas = 55.845
  reaction = "Fe(g) -> Fe(s)"
  mu = 56.0
  a0_angstrom = 1.411

