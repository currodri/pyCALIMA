  [[species.Mg2SiO4.key]]
  gas = "SiO"
  m_gas = 44.085
  reaction = "2Mg(g) + SiO(g) + 3H2O(g) -> Mg2SiO4(s) + 3H2(g)"
  mu = 140.0
