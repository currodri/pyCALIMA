name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede in-flight PR runs, but never cancel a Pages deploy mid-flight.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A writable root outside the checkout. pycalima._paths otherwise falls back
  # to "./model_data if it exists, or the CWD if it is a source checkout", and
  # the CI checkout *is* one -- so leaving this implicit would make resolution
  # depend on each step's working directory.
  CALIMA_DATA: ${{ github.workspace }}/.calima
  CALIMA_MODEL_DATA: ${{ github.workspace }}/.calima/model_data
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # =========================================================================
  # Fast tests, no generated tables.
  # =========================================================================
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm needs full history. Without it pycalima.__version__
          # is the 0.1.0 fallback and _provenance stamps the wrong revision
          # into every generated table header.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint for syntax errors and undefined names
        # Only these four rules. The codebase has never been linted, so a full
        # rule set would fail on day one and tell us nothing new; these catch
        # actual breakage.
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 src tests

      - name: pytest
        # Some tests skip without generated tables; that is by design. The
        # model-data job below covers them.
        run: pytest -ra -q

  # =========================================================================
  # Build the distributions and test against the wheel, not the checkout.
  # =========================================================================
  packaging:
    name: packaging
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine check-manifest
          python -m build
          twine check dist/*
          check-manifest

      - name: Install the wheel into a clean environment and test it
        # Editable installs mask unguarded optional imports and missing package
        # data, which is exactly where the packaging bugs were.
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip
          /tmp/wheelenv/bin/pip install "$(ls dist/*.whl)[dev]"
          /tmp/wheelenv/bin/python -m pytest -ra -q tests/

  # =========================================================================
  # Generate the lookup tables the tutorials need, and cache them.
  # =========================================================================
  model-data:
    name: model_data
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compute cache key
        id: key
        # Everything that can change a generated table's contents.
        run: |
          echo "value=model-data-v1-${{ runner.os }}-${{ hashFiles(
            'src/pycalima/models/grain_size_distribution.json',
            'src/pycalima/models/export_all_grain_data.py',
            'src/pycalima/models/grain_distributions.py',
            'src/pycalima/models/grain_size_config.py',
            'src/pycalima/models/constants.py',
            'src/pycalima/models/dust_model.py',
            'src/pycalima/models/dust_charge/**.py',
            'src/pycalima/models/dust_radiation/**.py',
            'src/pycalima/models/dust_gas_collisions/**.py',
            'src/pycalima/models/PAH_charge/**.py',
            'src/pycalima/models/PAH_radiation/**.py',
            'src/pycalima/models/PAH_gas_collisions/**.py',
            'src/pycalima/models/PAH_photophysics/**.py',
            'src/pycalima/models/tools/**.py',
            'src/pycalima/data/registry.toml'
          ) }}" >> "$GITHUB_OUTPUT"

      - name: Restore model_data
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CALIMA_MODEL_DATA }}
          key: ${{ steps.key.outputs.value }}
          # Deliberately no restore-keys. A prefix match would serve tables
          # generated from a *different* bin configuration, and the
          # table-dependent tests assert invariants rather than recorded
          # values -- so they would pass against wrong physics. Regenerating
          # is much cheaper than that failure mode.

      - name: Export the tables the tutorials need
        if: steps.cache.outputs.cache-hit != 'true'
        # dust_ion_recombination is 45.5% of a full export and nothing
        # downstream reads its tables; dust_band_luminosities is skipped only
        # for tidiness. See docs/cli/calima-export.md for the measured profile.
        run: |
          mkdir -p "$CALIMA_MODEL_DATA"
          calima-export \
            --skip-stages dust_ion_recombination,dust_band_luminosities \
            --profile-output "$CALIMA_MODEL_DATA/ci_export_profile.json"

      - name: Assert the tables actually exist
        # Without this a partially failed export leaves the table-dependent
        # tests silently skipping and the notebooks failing later in the docs
        # job, where the cause is much harder to see.
        run: |
          set -e
          for d in optical_properties thermal_sputtering_data \
                   pah_sputtering_data dust_charging_data \
                   dust_photoelectric_heating_data dust_sublimation \
                   PAH_dissociation_data PAH_photoelectric_heating_data \
                   collisional_cooling_data; do
            test -d "$CALIMA_MODEL_DATA/$d" || { echo "::error::missing $d"; exit 1; }
          done
          du -sh "$CALIMA_MODEL_DATA"

      - name: Drop quicklook figures before caching
        if: steps.cache.outputs.cache-hit != 'true'
        # The exporters emit hundreds of .png/.pdf quicklooks that nothing
        # downstream reads.
        run: |
          find "$CALIMA_MODEL_DATA" \( -name '*.png' -o -name '*.pdf' \) -delete
          du -sh "$CALIMA_MODEL_DATA"

      - name: Save model_data
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CALIMA_MODEL_DATA }}
          key: ${{ steps.key.outputs.value }}

      - name: Full suite, including the table-dependent tests
        run: pytest -ra -q

  # =========================================================================
  # Documentation.
  # =========================================================================
  docs:
    name: docs
    runs-on: ubuntu-latest
    needs: [model-data]
    # NOTE: MPLBACKEND is deliberately NOT set for this job. myst-nb executes
    # notebooks in a subprocess kernel that inherits the environment, and with
    # MPLBACKEND=Agg the inline backend's automatic figure display never runs
    # -- every figure vanishes silently. conf.py calls matplotlib.use("Agg")
    # for the Sphinx process instead.
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Restore model_data
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CALIMA_MODEL_DATA }}
          key: ${{ needs.model-data.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache notebook execution
        # jupyter-cache keys on notebook content, so an unchanged notebook is
        # not re-executed even when the prose changes.
        uses: actions/cache@v4
        with:
          path: docs/_build/.jupyter_cache
          key: nbcache-v1-${{ hashFiles('notebooks/calima_tutorial.ipynb', 'notebooks/calima_dust_pah_processes.ipynb') }}
          restore-keys: nbcache-v1-

      - name: Structural checks on the docs sources
        # Covers the dollarmath $VAR trap, stale api/*.md module lists, leftover
        # relative anchors and forbidden content. A grep cannot do the first of
        # those correctly, because a bare $VAR inside a code fence is fine.
        run: pytest -ra -q tests/test_docs.py

      - name: Build
        # -E forces a full read: Sphinx does not re-emit warnings for pages it
        # takes from the doctree cache, so an incremental build would
        # under-report and the budget check below would be meaningless.
        # -n is not used; see docs/development/docs.md.
        run: |
          python -m sphinx -b html -E --keep-going \
            -w docs/_build/warnings.txt docs docs/_build/html

      - name: Warning budget
        # A hard -W gate would require a docstring cleanup that is a separate
        # job. Gate on a count that can only ratchet down instead.
        run: |
          budget=$(tr -d '[:space:]' < docs/warning-budget.txt)
          count=$(grep -cE 'WARNING|ERROR' docs/_build/warnings.txt || true)
          echo "warnings: $count   budget: $budget"
          sed -n '1,60p' docs/_build/warnings.txt
          if [ "$count" -gt "$budget" ]; then
            echo "::error::$count warnings exceeds the budget of $budget"
            exit 1
          fi
          if [ "$count" -lt "$budget" ]; then
            echo "::notice::$count < $budget -- lower docs/warning-budget.txt"
          fi

      - name: Assert the tutorials produced figures
        # The MPLBACKEND trap fails silently: the build succeeds and the pages
        # render, just with no plots at all. myst-nb writes figures as files
        # under _images/ rather than inlining them, so count those references.
        # Measured locally: 8 and 11.
        run: |
          for page in calima_tutorial calima_dust_pah_processes; do
            n=$(grep -o '_images/[0-9a-f]\{16\}' "docs/_build/html/tutorials/$page.html" | sort -u | wc -l)
            echo "$page: $n figures"
            [ "$n" -ge 5 ] || { echo "::error::$page rendered only $n figures"; exit 1; }
          done

      - name: Assert nothing private was published
        run: |
          set -e
          if grep -rIl "\[Your name\]" docs/_build/html; then
            echo "::error::the galaxysam SUMMARY placeholder reached the build"
            exit 1
          fi
          if grep -rIlE "[a-z.]+@[a-z]+\.(unibe\.ch|edu|org)" docs/_build/html \
               --include='*.html' | grep -v genindex; then
            echo "::error::a third-party email address reached the build"
            exit 1
          fi

      - name: Upload for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html-${{ github.event.pull_request.number }}
          path: docs/_build/html
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # =========================================================================
  # Deploy to Pages. main only, and only if everything else passed.
  # =========================================================================
  deploy:
    name: deploy to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, packaging, model-data, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # A separate group from the CI one, so a queued deploy is never cancelled.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
